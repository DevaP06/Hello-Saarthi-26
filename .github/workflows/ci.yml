name: Saarthi CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      AI_WARMUP: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r saarthi_backend/requirements.txt -r saarthi_backend/requirements-ai-extras.txt portalocker qdrant-client pymupdf pdfplumber
      - run: python -m pytest -q -rs saarthi_backend/tests

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_saarthi_ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_saarthi_ai/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: "/"

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/saarthi_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: saarthi_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d saarthi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install SQLAlchemy==2.0.48 asyncpg==0.31.0 pydantic-settings==2.13.1
      - name: Apply migrations and verify a rerun
        run: |
          python saarthi_backend/migrations/run_migrations.py
          python saarthi_backend/migrations/run_migrations.py